name: Free market data snapshot

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "开始日期，格式 YYYYMMDD；留空默认最近 30 天"
        required: false
        type: string
      end_date:
        description: "结束日期，格式 YYYYMMDD；留空默认今天"
        required: false
        type: string
      providers:
        description: "数据源，逗号分隔：akshare,baostock,yfinance"
        required: false
        default: "akshare,baostock,yfinance"
        type: string
      adjust:
        description: "复权方式：none、qfq 或 hfq"
        required: false
        default: none
        type: choice
        options:
          - none
          - qfq
          - hfq

jobs:
  fetch:
    uses: Business-Unit-for-Stock/stock-research/.github/workflows/free-data.yml@main
    with:
      start_date: ${{ inputs.start_date }}
      end_date: ${{ inputs.end_date }}
      providers: ${{ inputs.providers || 'akshare,baostock,yfinance' }}
      adjust: ${{ inputs.adjust || 'none' }}
