name: Akshare Daily Data Fetch

on:
  schedule:
    # 示例：北京时间每天下午 18:00 运行 (UTC时间 10:00)
    - cron: '0 10 * * *'
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install akshare pandas requests
        # 如果有其他依赖，建议使用 pip install -r requirements.txt

    - name: Run Akshare Script
      env:
        # 如果需要推送消息到微信/钉钉，可以在仓库 Settings -> Secrets 中配置
        PUSH_KEY: ${{ secrets.PUSH_KEY }}
      run: |
        python scripts/my_data_fetcher.py
